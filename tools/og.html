<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scorched Puma — share card</title>
<style>body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}canvas{max-width:100%;image-rendering:pixelated}</style>
</head>
<body>
<!-- The share card (og.png, 1200x630), drawn from the game's own renderer:
     serve the repo over http, open tools/og.html, then save the canvas, or
     call ogPNG() from the console for its data URL. Not deployed. -->
<canvas id="og" width="1200" height="630"></canvas>
<script src="../js/util.js"></script>
<script src="../js/engine/const.js"></script>
<script src="../js/engine/terrain.js"></script>
<script src="../js/engine/tanks.js"></script>
<script src="../js/engine/physics.js"></script>
<script src="../js/engine/weapons.js"></script>
<script src="../js/engine/economy.js"></script>
<script src="../js/engine/ai.js"></script>
<script src="../js/engine/game.js"></script>
<script src="../js/pixfont.js"></script>
<script src="../js/art.js"></script>
<script src="../js/render.js"></script>
<script>
(() => {
  const G = SP.Game;
  /* a fixed battle: sunset, a MIRV coming down on the wolves */
  const players = [
    { name: "Tawny", faction: "puma", kind: "ai", ai: "cyborg" },
    { name: "Grey Fang", faction: "wolf", kind: "ai", ai: "shooter" },
    { name: "Catamount", faction: "puma", kind: "ai", ai: "chooser" },
    { name: "Lobo", faction: "wolf", kind: "ai", ai: "tosser" },
  ];
  const s = G.newMatch({ players, opts: { sky: "sunset", land: "rolling", bumpiness: 55, wind: "none", walls: "rubber" } }, 20261014);
  G.startRound(s);
  s.dirt = 3;
  const me = s.tanks.find(t => t.name === "Tawny"), tg = s.tanks.find(t => t.name === "Lobo");
  s.order.i = s.order.ids.indexOf(me.id);
  SP.Tanks.give(me, "mirv", 1);
  const sol = SP.AI.solve(s, me, tg, { exact: true });
  G.fire(s, { weapon: "mirv", angle: sol.angle, power: sol.power });
  /* run until the warheads have split and are on their way down */
  for (let i = 0; i < 4000 && !(s.ents.some(e => e.warhead) && s.ents.filter(e => e.warhead).every(e => e.y > SP.H * 0.42)); i++) G.tick(s);
  s.events.length = 0;
  const field = document.createElement("canvas");
  const r = new SP.Renderer(field);
  r.draw(s, { bubbles: [{ tank: me.id, text: "Here's a bone. It's a nuke.", life: 99 }] });

  const cv = document.getElementById("og"), g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.fillStyle = "#05070f"; g.fillRect(0, 0, 1200, 630);
  /* the battlefield across the bottom, scaled up crisp */
  const k = 1200 / SP.W, top = SP.H * 0.3, rows = SP.H - top;
  g.drawImage(field, 0, top, SP.W, rows, 0, 630 - rows * k, 1200, rows * k);
  /* a shade under the words */
  const sh = g.createLinearGradient(0, 0, 0, 330);
  sh.addColorStop(0, "rgba(5,7,15,1)"); sh.addColorStop(0.62, "rgba(5,7,15,.92)"); sh.addColorStop(1, "rgba(5,7,15,0)");
  g.fillStyle = sh; g.fillRect(0, 0, 1200, 330);
  g.fillStyle = "#54f2ff"; g.fillRect(0, 0, 1200, 8);
  const mono = 'Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace';
  g.font = `bold 84px ${mono}`;
  g.fillStyle = "#e9e9f2"; g.fillText("Scorched", 80, 132);
  g.fillStyle = "#54f2ff"; g.fillText("Puma", 80 + g.measureText("Scorched").width, 132);
  g.font = `34px ${mono}`; g.fillStyle = "#9aa1ae";
  g.fillText("Pumas vs. wolves on a field of falling dirt:", 80, 196);
  g.fillText("ten tanks, thirty-three weapons, and trash talk.", 80, 240);
  g.font = `28px ${mono}`; g.fillStyle = "#54f2ff";
  g.fillText("A remake of Scorched Earth (1991)", 80, 290);
  /* the icon, top right */
  const img = new Image();
  img.onload = () => { g.drawImage(img, 1010, 40, 130, 130); window.ogReady = true; };
  img.src = "../icon.svg?" + Date.now();   // never a cached copy of an old icon
  window.ogPNG = () => cv.toDataURL("image/png");
})();
</script>
</body>
</html>
