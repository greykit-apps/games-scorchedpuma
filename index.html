<body>
<div id="game" hidden>
  <header id="hud">
    <div class="who"><span class="sw" id="h-sw"></span><b id="h-name"></b><span class="side" id="h-side"></span><span class="hp" title="Health: a tank fires no harder than ten times what it has left"><i id="h-hp"></i></span></div>
    <div class="rd" id="h-angle"><span class="k">Angle</span><b>90</b></div>
    <div class="rd" id="h-power"><span class="k">Power</span><b>500</b><small>/1000</small></div>
    <button id="h-weapon" title="Weapon (Tab)"><span class="n"></span><span class="c"></span></button>
    <button id="h-items" title="Items (I)">Items <kbd>I</kbd><span class="armed"></span></button>
    <div class="rd" id="h-wind"><span class="k">Wind</span><b>0</b></div>
    <span id="h-state"></span>
    <span class="spacer"></span>
    <span id="h-cash"></span>
    <span id="h-round"></span>
    <button id="h-fire" class="primary">Fire <kbd>Space</kbd></button>
    <button id="snd" class="ico" aria-label="Sound" aria-pressed="true" title="Sound (M)"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="on" d="M11 5.5c1.2 1.4 1.2 3.6 0 5M12.8 3.8c2.1 2.4 2.1 6 0 8.4" stroke="currentColor" stroke-width="1.4" fill="none"/><path class="off" d="M11 5.5l4 5M15 5.5l-4 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button id="pausebtn" class="ico" aria-label="Pause" title="Pause (Esc)"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4" y="3" width="3" height="10" fill="currentColor"/><rect x="9" y="3" width="3" height="10" fill="currentColor"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="field" width="640" height="360" aria-label="Scorched Puma: the battlefield"></canvas>
    <div id="banner" aria-hidden="true"></div>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<div id="title" hidden></div>
<div id="small" role="dialog" aria-labelledby="small-h">
  <img class="px" src="icon.svg" width="96" height="96" alt="">
  <h1 id="small-h">Scorched Puma is built for a desktop</h1>
  <p>Ten tanks around one keyboard need a bigger screen than this. Come back on a computer.</p>
