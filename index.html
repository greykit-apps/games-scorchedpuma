<body>
<div id="game" hidden>
  <div id="stage">
    <canvas id="field" width="960" height="540" aria-label="Scorched Puma: the battlefield. Press and drag to aim."></canvas>
    <div id="banner" aria-hidden="true"></div>
    <ol id="log" aria-hidden="true"></ol>
    <div id="coach" hidden></div>
  </div>
  <footer id="console" aria-label="Controls">
    <section class="c-who" aria-label="Your tank">
      <div class="c-line"><span class="sw" id="c-sw"></span><b id="c-name"></b><span class="side" id="c-side"></span></div>
      <div class="c-line c-hpline"><div class="hp" title="Health"><i id="c-hp"></i></div><span id="c-hpn"></span></div>
      <div class="c-line c-sub"><span id="c-cash"></span><span id="c-score"></span></div>
      <div class="c-line c-drive" id="c-drive"><span class="k">Drive</span><span id="c-fuel"></span><button data-drive="-1" aria-label="Drive left">◀</button><button data-drive="1" aria-label="Drive right">▶</button></div>
    </section>
    <section class="c-aim">
      <div class="dial" id="c-angle">
        <span class="k">Angle</span><b class="v">90°</b>
        <span class="step"><button data-step="angle:1" aria-label="Angle up" title="Angle up (←)">▲</button><button data-step="angle:-1" aria-label="Angle down" title="Angle down (→)">▼</button></span>
      </div>
      <div class="dial" id="c-power">
        <span class="k">Power</span><b class="v">500</b><small class="max">/1000</small>
        <span class="step"><button data-step="power:1" aria-label="Power up" title="Power up (↑)">▲</button><button data-step="power:-1" aria-label="Power down" title="Power down (↓)">▼</button></span>
      </div>
      <div class="c-last" id="c-last"></div>
    </section>
    <section class="c-wind" id="c-wind" title="Wind: it pushes every shot">
      <span class="k">Wind</span><b class="v"></b><span class="arrow"></span>
    </section>
    <section class="c-arms">
      <div class="k">Weapons <kbd>Tab</kbd> <span id="c-wname"></span><span class="more" aria-hidden="true"></span></div>
      <div class="well"><div class="strip" id="c-weapons"></div></div>
    </section>
    <section class="c-items">
      <div class="k">Items <kbd>I</kbd><span class="more" aria-hidden="true"></span></div>
      <div class="well"><div class="strip" id="c-items"></div></div>
    </section>
    <section class="c-act">
      <button id="c-fire" class="primary">Fire <kbd>Space</kbd></button>
      <div class="c-line c-turn"><span class="sw" id="c-tsw"></span><span id="c-state"></span></div>
      <div class="c-line">
        <span id="c-round"></span>
        <button id="snd" class="ico" aria-label="Sound" aria-pressed="true" title="Sound (M)"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="on" d="M11 5.5c1.2 1.4 1.2 3.6 0 5M12.8 3.8c2.1 2.4 2.1 6 0 8.4" stroke="currentColor" stroke-width="1.4" fill="none"/><path class="off" d="M11 5.5l4 5M15 5.5l-4 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button id="pausebtn" class="ico" aria-label="Pause" title="Pause (Esc)"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4" y="3" width="3" height="10" fill="currentColor"/><rect x="9" y="3" width="3" height="10" fill="currentColor"/></svg></button>
      </div>
    </section>
  </footer>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<div id="title" hidden></div>
<div id="small" role="dialog" aria-labelledby="small-h">
  <img class="px" src="icon.svg" width="96" height="96" alt="">
  <h1 id="small-h">Turn your phone sideways</h1>
  <p>Ten tanks and their console need a wide screen. Scorched Puma plays on a phone held sideways, or on a computer.</p>
